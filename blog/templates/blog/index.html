{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'blog/styles.css' %}" />
    <title>Blog - {{ title }}</title>
  </head>
  <body dir="rtl">
    <h1>הפוסטים שלנו</h1>
    {% for post in posts %}
    <a href="">
      <div class="post-item">
        <h2>{{ post.title }}</h2>
        <p>{{ post.shortened_content }}</p>
        <p>{{ post.updated_at }}</p>
      </div>
    </a>
    {% endfor %}
  </body>
</html>
